<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1096 670" width="1096" height="670" role="img" xml:lang="uk">
  <title>Чотири метрики оцінювання Text-to-SQL</title>
  <desc>Зіставлення компонент, повний збіг, точність виконання і показник ефективності на одному еталонному запиті.</desc>
  <defs></defs>

  <rect width="1096" height="670" rx="14" fill="#d6e7f6"/>

  <g transform="translate(-12,-42)">
  <rect x="20" y="50" width="1080" height="36" rx="10" fill="#ffffff"/>
  <text x="36" y="74" font-family="-apple-system, Segoe UI, sans-serif" font-size="16.5" fill="#111111"><tspan font-size="17" font-weight="700" fill="#111111">Питання:</tspan> як звати співаків зі Франції, старших за 30 років?</text>

  <rect x="20" y="94" width="1080" height="36" rx="10" fill="#eaf6ea"/>
  <text x="36" y="118" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" fill="#1c2833"><tspan font-size="17" font-weight="700" fill="#111111" xml:space="preserve">Еталонний SQL-запит: </tspan> <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1c2833">SELECT name FROM singer WHERE country = 'France' AND age &gt; 30</tspan></text>

  <line x1="20" y1="152" x2="448" y2="152" stroke="#1a5276" stroke-width="1.4"/>
  <text x="560" y="158" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1a5276">Зіставлення вмісту</text>
  <line x1="672" y1="152" x2="1100" y2="152" stroke="#1a5276" stroke-width="1.4"/>

  <g>
    <rect x="20" y="170" width="532" height="242" rx="14" fill="#ffffff"/>
    <path d="M20 184 h532 v26 h-532 z" fill="#1a5276"/>
    <rect x="20" y="170" width="532" height="28" rx="14" fill="#1a5276"/>
    <text x="36" y="190" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Зіставлення компонент (CM)</text>
    <text x="36" y="228" font-family="-apple-system, Segoe UI, sans-serif" font-size="15.5" fill="#111111">Кожен компонент (SELECT, FROM, WHERE) оцінюють окремо.</text>
    <text x="36" y="252" font-family="-apple-system, Segoe UI, sans-serif" font-size="15.5" fill="#111111">Інший порядок допустимий, якщо склад компонент збігається.</text>
    <text x="36" y="280" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111111">Згенерований SQL-запит</text>
    <text x="36" y="304" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1c2833">SELECT name</text>
    <text x="36" y="324" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1c2833">FROM singer</text>
    <text x="36" y="344" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1c2833">WHERE age &gt; 30 AND country = 'France'</text>
    <rect x="36" y="368" width="92" height="28" rx="14" fill="#e8f8f5"/>
    <text x="82" y="387" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#196f3d">Збіг</text>
    <text x="140" y="387" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" fill="#196f3d">SELECT, FROM і WHERE на місці</text>
  </g>

  <g>
    <rect x="568" y="170" width="532" height="242" rx="14" fill="#ffffff"/>
    <path d="M568 184 h532 v26 h-532 z" fill="#6c3483"/>
    <rect x="568" y="170" width="532" height="28" rx="14" fill="#6c3483"/>
    <text x="584" y="190" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Повний збіг (EM)</text>
    <text x="584" y="228" font-family="-apple-system, Segoe UI, sans-serif" font-size="15.5" fill="#111111">Кожна компонента має збігтися як множина складників.</text>
    <text x="584" y="252" font-family="-apple-system, Segoe UI, sans-serif" font-size="15.5" fill="#111111">Якщо множина хоч однієї інша, збігу немає.</text>
    <text x="584" y="280" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111111">Згенерований SQL-запит</text>
    <text x="584" y="304" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1c2833">SELECT name</text>
    <text x="584" y="324" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1c2833">FROM singer</text>
    <text x="584" y="344" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1c2833">WHERE country = 'France' AND age &gt; 20</text>
    <rect x="584" y="368" width="148" height="28" rx="14" fill="#fadbd8"/>
    <text x="658" y="387" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#922b21">Розбіжність</text>
    <text x="744" y="387" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" fill="#922b21">Умова age інша</text>
  </g>

  <line x1="20" y1="440" x2="420" y2="440" stroke="#196f3d" stroke-width="1.4"/>
  <text x="560" y="446" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#196f3d">За результатом виконання</text>
  <line x1="700" y1="440" x2="1100" y2="440" stroke="#196f3d" stroke-width="1.4"/>

  <g>
    <rect x="20" y="458" width="532" height="242" rx="14" fill="#ffffff"/>
    <path d="M20 472 h532 v26 h-532 z" fill="#196f3d"/>
    <rect x="20" y="458" width="532" height="28" rx="14" fill="#196f3d"/>
    <text x="36" y="478" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Точність виконання (EX)</text>
    <text x="36" y="516" font-family="-apple-system, Segoe UI, sans-serif" font-size="15.5" fill="#111111">Обидва запити виконують на тій самій базі.</text>
    <text x="36" y="540" font-family="-apple-system, Segoe UI, sans-serif" font-size="15.5" fill="#111111">Якщо результати збігаються, структуру не враховують.</text>
    <text x="36" y="568" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111111">Згенерований SQL-запит</text>
    <text x="36" y="592" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1c2833">SELECT s.name</text>
    <text x="36" y="612" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1c2833">FROM singer AS s</text>
    <text x="36" y="632" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1c2833">WHERE s.age &gt; 30 AND s.country = 'France'</text>
    <rect x="36" y="656" width="92" height="28" rx="14" fill="#e8f8f5"/>
    <text x="82" y="675" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#196f3d">Збіг</text>
    <text x="140" y="675" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" fill="#196f3d">Той самий результат</text>
  </g>

  <g>
    <rect x="568" y="458" width="532" height="242" rx="14" fill="#ffffff"/>
    <path d="M568 472 h532 v26 h-532 z" fill="#9a7d0a"/>
    <rect x="568" y="458" width="532" height="28" rx="14" fill="#9a7d0a"/>
    <text x="584" y="478" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Показник ефективності (VES)</text>
    <text x="584" y="516" font-family="-apple-system, Segoe UI, sans-serif" font-size="15.5" fill="#111111">R = √(час еталона / час згенерованого запиту).</text>
    <text x="584" y="540" font-family="-apple-system, Segoe UI, sans-serif" font-size="15.5" fill="#111111">До запиту додано зайвий підзапит, виконання повільніше.</text>
    <text x="584" y="568" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111111">Згенерований SQL-запит</text>
    <text x="584" y="592" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1c2833">SELECT name FROM singer</text>
    <text x="584" y="612" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1c2833">WHERE country = 'France' AND age &gt; 30</text>
    <text x="584" y="632" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5" fill="#1c2833">AND singer_id IN (SELECT singer_id FROM singer)</text>
    <rect x="584" y="656" width="72" height="28" rx="14" fill="#fdebd0"/>
    <text x="620" y="675" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#9a7d0a">R &lt; 1</text>
    <text x="668" y="675" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" fill="#9a7d0a">запит повільніший за еталон</text>
  </g>
  </g>
</svg>
