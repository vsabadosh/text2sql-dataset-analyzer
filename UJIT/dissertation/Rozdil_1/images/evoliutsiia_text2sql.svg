<title id="title">Еволюція підходів до природномовного доступу до БД і Text-to-SQL</title>
<desc id="description">Авторська схема за першоджерелами. Чотири умовні етапи з перекриттям; нерівномірна часова шкала. LUNAR і NaLIX не генерували SQL. Крива є концептуальною, а не кількісною оцінкою якості. Дати позначають орієнтовне становлення підходів. Джерела та пояснення: ../../Related_Work/ground_truth_rozdil_1.md</desc>
