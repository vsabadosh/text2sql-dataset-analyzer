sourceDb:
  dialect: sqlite
  kind: file
  endpoint: "${SOURCE_DB_ENDPOINT}"

load:
  name: jsonl
  params:
    path: "${INPUT_PATH}"

progress:
  show_progress: false

normalize:
  - name: alias_mapper
    params:
      mapping:
        id: id
        question: question
        sql: sql
        schema: schema
        dbId: dbId

analyze:
  - name: query_antipattern_analyzer
    params:
      enabled: true
      penalties:
        critical: 30
        high: 15
      antipatterns:
        sqlite:
          critical:
            - chained_comparison_semantics
            - conditional_count_non_null_else
            - unquoted_date_arithmetic
            - literal_division_by_zero
          high:
            - scalar_subquery_cardinality

output:
  dataset_name: "${DATASET_NAME}"
  base_dir: "UJIT/silent-semantics-runs"
  jsonl_enabled: true
  reports:
    enabled: true
    output_dir: "all_reports"
    summary_report: true
    schema_validation: false
    llm_judge_issues: false
    query_execution_issues: false
    query_structure_profile: false
    table_coverage: false
    query_quality: true
    question_sql_consistency: false
